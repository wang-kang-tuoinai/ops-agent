name: ops-agent
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ops_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10
  obs-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: observability
    ports:
      - "3307:3306" # 宿主机换个端口，避免和业务 mysql 的 3306 冲突
    volumes:
      - obs-mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 3s
      retries: 10
  agent-mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${AGENT_MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ops_diagnosis
      MYSQL_USER: agent
      MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-agent}
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - agent-mysql-data:/var/lib/mysql
    healthcheck:
      # 使用应用账户检查目标库，确保初始化与授权已经完成。
      test: [ "CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 5s
      timeout: 5s
      retries: 10
  consumer:
    build:
      context: ./ops-agent-backend
      dockerfile: ./Dockerfile.consumer
    environment:
      RABBITMQ_ADDR: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686" # Jaeger UI(浏览器访问)
      - "4318:4318" # OTLP HTTP 接收端口(你的应用往这发数据)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
  app:
    build: ./ops-agent-backend/
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      RABBITMQ_ADDR: amqp://guest:guest@rabbitmq:5672/
      MYSQL_DSN: root:root@tcp(mysql:3306)/ops_agent?charset=utf8mb4&parseTime=True&loc=Local
      OBS_MYSQL_DSN: root:root@tcp(obs-mysql:3306)/observability?charset=utf8mb4&parseTime=True&loc=Local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  rag-service:
    build: ./rag-service/
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - C:/Users/HP/.cache/huggingface:/app/hf_home
      - ./rag-service/my_chroma_data:/app/my_chroma_data
      - ./rag-service/conversations:/app/conversations
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health', timeout=3); sys.exit(0)" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s
    depends_on:
      app:
        condition: service_started

  ops-diagnosis-agent:
    build: ./ops-diagnosis-agent/
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      AGENT_MYSQL_HOST: agent-mysql
      AGENT_MYSQL_PORT: "3306"
      AGENT_MYSQL_USER: agent
      AGENT_MYSQL_PASSWORD: ${AGENT_MYSQL_PASSWORD:-agent}
      AGENT_MYSQL_DATABASE: ops_diagnosis
      AGENT_CHECKPOINT_PATH: /app/data/checkpoints.sqlite
      AGENT_KEEP_TURNS: ${AGENT_KEEP_TURNS:-20}
      OBS_API_BASE: http://obs-api:8081/api/v1
      RAG_API_BASE: http://rag-service:8000/api/v1
    volumes:
      - agent-checkpoints:/app/data
    healthcheck:
      test: [ "CMD", "python", "-c", "import json,urllib.request; response=json.load(urllib.request.urlopen('http://localhost:8001/health', timeout=3)); assert response.get('ready') is True" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      agent-mysql:
        condition: service_healthy
      obs-api:
        condition: service_started
      rag-service:
        condition: service_started

  rag-gateway:
    build: ./rag-gateway/
    ports:
      - "8081:8081"
    environment:
      RAG_SERVICE_URL: http://rag-service:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      rag-service:
        condition: service_healthy
      jaeger:
        condition: service_started

  obs-api:
    build: ./obs-api/
    ports:
      - "8082:8081"
    environment:
      OBS_MYSQL_DSN: root:root@tcp(obs-mysql:3306)/observability?charset=utf8mb4&parseTime=True&loc=Local
    depends_on:
      obs-mysql:
        condition: service_healthy

volumes:
  mysql-data:
  redis_data:
  obs-mysql-data:
  agent-mysql-data:
  agent-checkpoints:
